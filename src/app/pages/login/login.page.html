<ion-content [fullscreen]="true" class="login-content">
  <!-- ── Cabecera verde ───────────────────────────────── -->
  <div class="login-header">
    <button class="back-btn" (click)="goBack()">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>

    <p class="header-tag">Acceso</p>
    <h1 class="header-title">Iniciar Sesión</h1>
    <p class="header-desc">
      Accede al sistema de gestión de empleados de Corporación KSK.
    </p>
  </div>

  <!-- ── Tarjeta blanca ───────────────────────────────── -->
  <div class="login-card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- USUARIO -->
      <div class="field-group">
        <label class="field-label">Usuario</label>
        <div
          class="field-wrapper"
          [class.is-error]="hasError('usuario', 'required')"
          [class.is-filled]="f['usuario'].value"
        >
          <ion-icon name="person-outline" class="field-icon"></ion-icon>
          <input
            formControlName="usuario"
            type="text"
            class="field-input"
            placeholder="Ingresa tu usuario"
            autocomplete="username"
          />
        </div>
        <span class="error-msg" *ngIf="hasError('usuario', 'required')">
          El usuario es obligatorio
        </span>
      </div>

      <!-- CONTRASEÑA -->
      <div class="field-group">
        <label class="field-label">Contraseña</label>
        <div
          class="field-wrapper"
          [class.is-error]="hasError('contrasena', 'required')"
          [class.is-filled]="f['contrasena'].value"
        >
          <ion-icon name="lock-closed-outline" class="field-icon"></ion-icon>
          <input
            formControlName="contrasena"
            [type]="showPassword ? 'text' : 'password'"
            class="field-input"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
          />
          <button type="button" class="eye-btn" (click)="togglePassword()">
            <ion-icon
              [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
            ></ion-icon>
          </button>
        </div>
        <span class="error-msg" *ngIf="hasError('contrasena', 'required')">
          La contraseña es obligatoria
        </span>
      </div>

      <!-- BOTÓN SUBMIT -->
      <button type="submit" class="btn-submit" [disabled]="isLoading">
        <ion-spinner
          *ngIf="isLoading"
          name="crescent"
          class="btn-spinner"
        ></ion-spinner>
        <span>{{ isLoading ? 'Verificando...' : 'Iniciar Sesión' }}</span>
      </button>
    </form>
  </div>
</ion-content>
