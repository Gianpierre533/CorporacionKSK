<ion-content class="login-content" [scrollY]="false">
  <div class="blob-container">
    <svg
      class="blob-svg"
      viewBox="0 0 480 420"
      xmlns="http://www.w3.org/2000/svg"
      preserveAspectRatio="xMaxYMin slice"
    >
      <defs>
        <linearGradient id="blobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2ECFB3" stop-opacity="1" />
          <stop offset="100%" stop-color="#1A9E8A" stop-opacity="1" />
        </linearGradient>
      </defs>
      <path
        fill="url(#blobGrad)"
        d="M480,0 L480,280 C460,310 430,335 395,320 C340,298 310,240 265,210 C215,177 155,175 110,148 C65,121 30,75 10,30 C2,12 0,6 0,0 Z"
      />
    </svg>
  </div>

  <div class="back-btn-wrapper">
    <button class="back-btn" (click)="goBack()">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </button>
  </div>

  <div class="page-wrapper">
    <div class="header-text">
      <span class="access-label">ACCESO</span>
      <h1 class="title">Iniciar Sesión</h1>
      <p class="subtitle">Bienvenido a KSK Importaciones</p>
    </div>

    <div class="form-card">
      <!-- Selector de Rol Premium -->
      <div class="role-selector-container">
        <button
          type="button"
          class="role-tab"
          [class.active]="rolSeleccionado === 'cliente'"
          (click)="setRol('cliente')"
        >
          <ion-icon name="person-outline"></ion-icon>
          <span>Soy Cliente</span>
        </button>
        <button
          type="button"
          class="role-tab"
          [class.active]="rolSeleccionado === 'empleado'"
          (click)="setRol('empleado')"
        >
          <ion-icon name="briefcase-outline"></ion-icon>
          <span>Soy Empleado</span>
        </button>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="input-group" [class.has-error]="isFieldInvalid('usuario')">
          <label class="field-label">
            {{ rolSeleccionado === 'cliente' ? 'Usuario' : 'Usuario de Empleado'
            }}
          </label>
          <div
            class="input-wrapper"
            [class.focused]="usernameFocused"
            [class.error]="isFieldInvalid('usuario')"
          >
            <ion-icon
              [name]="rolSeleccionado === 'cliente' ? 'person-outline' : 'briefcase-outline'"
              class="input-icon"
            ></ion-icon>
            <input
              formControlName="usuario"
              type="text"
              [placeholder]="rolSeleccionado === 'cliente' ? 'Tu nombre de usuario' : 'Tu usuario corporativo'"
              class="custom-input"
              autocomplete="username"
              (focus)="usernameFocused = true"
              (blur)="usernameFocused = false"
            />
          </div>
          <ng-container *ngIf="isFieldInvalid('usuario')">
            <span class="error-msg">El usuario es requerido</span>
          </ng-container>
        </div>

        <div
          class="input-group"
          [class.has-error]="isFieldInvalid('contrasena')"
        >
          <label class="field-label">Contraseña</label>
          <div
            class="input-wrapper"
            [class.focused]="passwordFocused"
            [class.error]="isFieldInvalid('contrasena')"
          >
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <input
              formControlName="contrasena"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="••••••••"
              class="custom-input"
              autocomplete="current-password"
              (focus)="passwordFocused = true"
              (blur)="passwordFocused = false"
            />
            <button type="button" class="eye-btn" (click)="togglePassword()">
              <ion-icon
                [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
              ></ion-icon>
            </button>
          </div>
          <ng-container *ngIf="isFieldInvalid('contrasena')">
            <span class="error-msg">La contraseña es requerida</span>
          </ng-container>
        </div>

        <div class="forgot-row">
          <button type="button" class="forgot-link">
            ¿Olvidaste tu contraseña?
          </button>
        </div>

        <button
          type="submit"
          class="submit-btn"
          [class.loading]="isLoading"
          [disabled]="isLoading"
        >
          <ng-container *ngIf="!isLoading; else loadingSpinner">
            <span>Iniciar Sesión</span>
          </ng-container>
          <ng-template #loadingSpinner>
            <span class="spinner-wrap">
              <ion-spinner name="crescent" class="btn-spinner"></ion-spinner>
            </span>
          </ng-template>
        </button>

        <div class="divider">
          <span class="divider-line"></span>
          <span class="divider-text">o continúa con</span>
          <span class="divider-line"></span>
        </div>

        <button type="button" class="google-btn">
          <svg class="google-icon" viewBox="0 0 24 24">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
              fill="#FBBC05"
            />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            />
          </svg>
          Continuar con Google
        </button>
      </form>

      <p class="footer-text">
        ¿No tienes cuenta?
        <button type="button" class="register-link" (click)="irARegistro()">
          Regístrate
        </button>
      </p>
    </div>
  </div>
</ion-content>
