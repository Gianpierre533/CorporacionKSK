<ion-content class="registro-content">
  <div class="glow-bg-1"></div>
  <div class="glow-bg-2"></div>

  <div class="back-btn-minimal" (click)="goBack()">
    <ion-icon name="chevron-back-outline"></ion-icon>
  </div>

  <div class="form-wrapper">
    <div class="registro-header">
      <div class="logo-registro">
        <img src="assets/logo-ksk.png" alt="KSK Logo" />
      </div>
      <span class="tag-premium">Nuevo Cliente</span>
      <h1 class="titulo-premium">Crear Cuenta</h1>
      <p class="subtitulo-premium">Regístrate en KSK Importaciones</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onRegister()">
      <div
        class="input-group-premium"
        [class.is-invalid]="isFieldInvalid('nombre')"
      >
        <label>Nombre Completo</label>
        <div class="input-field">
          <ion-icon name="person-outline"></ion-icon>
          <input
            type="text"
            formControlName="nombre"
            placeholder="Nombre Usuario"
          />
        </div>
        <p class="error-text" *ngIf="hasError('nombre', 'required')">
          El nombre es requerido
        </p>
      </div>

      <div
        class="input-group-premium"
        [class.is-invalid]="isFieldInvalid('usuario')"
      >
        <label>Correo Electrónico</label>
        <div class="input-field">
          <ion-icon name="person-outline"></ion-icon>
          <input
            type="text"
            formControlName="usuario"
            placeholder="Correo Electrónico"
          />
        </div>
        <p class="error-text" *ngIf="hasError('usuario', 'required')">
          El correo es requerido
        </p>
      </div>

      <div
        class="input-group-premium"
        [class.is-invalid]="isFieldInvalid('contrasena')"
      >
        <label>Contraseña</label>
        <div class="input-field">
          <ion-icon name="lock-closed-outline"></ion-icon>
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="contrasena"
            placeholder="••••••"
          />
          <ion-icon
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
            class="eye-icon"
            (click)="togglePassword()"
          ></ion-icon>
        </div>
        <p class="error-text" *ngIf="hasError('contrasena', 'required')">
          La contraseña es requerida
        </p>
        <p class="error-text" *ngIf="hasError('contrasena', 'minlength')">
          Mínimo deben ser 6 caracteres
        </p>
      </div>

      <button
        type="submit"
        (click)="onRegister()"
        class="btn-premium-submit"
        [disabled]="isLoading"
      >
        <ng-container *ngIf="isLoading; else registerLabel">
          <ion-spinner name="crescent"></ion-spinner>
        </ng-container>
        <ng-template #registerLabel>Registrarse ahora</ng-template>
      </button>

      <div class="footer-navigation">
        <p>
          ¿Ya tienes cuenta?
          <span (click)="goBack()">Inicia Sesión</span>
        </p>
      </div>
    </form>
  </div>
</ion-content>
