<ion-content [fullscreen]="true" class="bienvenida-content">
  <!-- ── Parte superior: logo real ────────────────────── -->
  <div class="bienvenida-top">
    <div class="logo-wrapper">
      <img src="assets/KSKLogo.png" alt="Corporación KSK" class="logo-img" />
    </div>

    <p class="company-name">Corporación KSK S.A.C.</p>
    <p class="company-sub">Comercio e Importaciones</p>
  </div>

  <!-- ── Tarjeta verde inferior ───────────────────────── -->
  <div class="bienvenida-card">
    <h1 class="card-title">Bienvenido</h1>

    <p class="card-desc">
      Sistema de gestión interna para empleados de Corporación KSK. Accede con
      tu cuenta para continuar.
    </p>

    <ion-button class="btn-ingresar" expand="block" (click)="goToLogin()">
      Iniciar Sesión
    </ion-button>
  </div>
</ion-content>
