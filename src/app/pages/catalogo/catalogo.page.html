<!-- ============================================================
     CATÁLOGO DE PRODUCTOS
     Header verde + chips de categoría + lista de productos
     ============================================================ -->

<!-- ── Header ───────────────────────────────────────────── -->
<ion-header class="header-custom">
  <ion-toolbar class="toolbar-custom">
    <!-- Botón de regreso al menú -->
    <ion-buttons slot="start">
      <ion-back-button
        defaultHref="/menu"
        text=""
        class="back-custom"
      ></ion-back-button>
    </ion-buttons>

    <ion-title class="titulo-catalogo">Catálogo de Productos</ion-title>

    <!-- Botón para abrir/cerrar la búsqueda -->
    <ion-buttons slot="end">
      <button class="btn-buscar" (click)="toggleBusqueda()">
        <ion-icon
          [name]="mostrarBusqueda ? 'close-outline' : 'search-outline'"
        ></ion-icon>
      </button>
    </ion-buttons>
  </ion-toolbar>

  <!-- Barra de búsqueda (visible al tocar el ícono de lupa) -->
  <div class="search-container" *ngIf="mostrarBusqueda">
    <div class="search-box">
      <ion-icon name="search-outline" class="search-icon"></ion-icon>
      <input
        type="text"
        class="search-input"
        placeholder="Buscar producto..."
        [value]="searchQuery"
        (input)="onSearch($event)"
        autofocus
      />
      <button
        type="button"
        class="search-clear"
        *ngIf="searchQuery"
        (click)="clearSearch()"
      >
        <ion-icon name="close-outline"></ion-icon>
      </button>
    </div>
  </div>

  <!-- Chips de filtro por categoría -->
  <div class="filtros-scroll">
    <div class="filtros-container">
      <button
        class="chip"
        [class.chip--active]="categoriaActiva === cat.key"
        *ngFor="let cat of categorias"
        (click)="filtrarCategoria(cat.key)"
      >
        {{ cat.label }}
      </button>
    </div>
  </div>
</ion-header>

<!-- ── Contenido ─────────────────────────────────────────── -->
<ion-content class="catalogo-content">
  <!-- Estado vacío cuando no hay resultados -->
  <div class="empty-state" *ngIf="productosFiltrados.length === 0">
    <ion-icon name="cube-outline" class="empty-icon"></ion-icon>
    <h3 class="empty-title">Sin resultados</h3>
    <p class="empty-desc">Intenta con otro término o categoría</p>
  </div>

  <!-- Lista de tarjetas de productos -->
  <div class="productos-lista" *ngIf="productosFiltrados.length > 0">
    <div
      class="producto-card"
      *ngFor="let p of productosFiltrados"
      (click)="verDetalle(p)"
    >
      <!-- Imagen del producto -->
      <div class="producto-imagen">
        <img [src]="p.imagen" [alt]="p.nombre" />
      </div>

      <!-- Información del producto -->
      <div class="producto-info">
        <p class="producto-nombre">{{ p.nombre }}</p>
        <p class="producto-desc">{{ p.descripcion }}</p>

        <!-- Precio y stock -->
        <div class="producto-footer">
          <p class="producto-precio">S/ {{ p.precio | number:'1.2-2' }}</p>
          <span
            class="stock-badge"
            [class.stock-badge--ok]="p.stock > 10"
            [class.stock-badge--low]="p.stock <= 10"
          >
            Stock: {{ p.stock }}
          </span>
        </div>
      </div>

      <!-- Flecha indicadora de navegación -->
      <ion-icon
        name="chevron-forward-outline"
        class="producto-flecha"
      ></ion-icon>
    </div>
  </div>
</ion-content>
